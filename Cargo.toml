[package]
name = "url-shortener"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "API de raccourcissement d'URL avec authentification et analytics"
publish = false

[dependencies]
anyhow = "1"
argon2 = { version = "0.6", features = ["getrandom"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
rand = "0.10"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "mysql",
    "mysql-rsa",
    "migrate",
    "macros",
    "chrono",
    "derive",
    "tls-rustls-ring-native-roots",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
strip = true
